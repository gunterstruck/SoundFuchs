name: CI

# Bis hierher gab es nur den Deploy auf GitHub Pages – der läuft erst NACH dem
# Merge und prüft nur, ob `tsc` im Build durchkommt. Ein Pull Request wurde
# damit von nichts geprüft. Diese Datei schließt die Lücke: dieselben vier
# Befehle, die auch lokal gelten, laufen bei jedem PR und bei jedem Push auf
# main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      # Zwei Prüfungen für Fehler, die sonst niemand meldet.
      #
      # check-i18n: Fünf Sprachen, ein Schlüsselsatz — und zusätzlich, ob ein
      # verwendeter Schlüssel überhaupt existiert. Die zweite Hälfte fehlte
      # bisher: t() gibt bei unbekanntem Schlüssel den Schlüssel selbst zurück,
      # in der Oberfläche stand also wörtlich "buttons.ok". 28 solche Stellen
      # lagen unbemerkt im Bestand, weil alle fünf Sprachen einträchtig
      # dasselbe vermissten.
      #
      # token-check: CSS meldet einen falsch geschriebenen Variablennamen nicht.
      # `background: var(--card-bg)` fällt still aus, wenn das Token --bg-card
      # heißt — weiße Schrift steht dann auf durchsichtigem Grund.
      - run: npm run check-i18n
      - run: npm run token-check
      # css-check: Eine Regel fuer ein Element, das es nicht mehr gibt, faellt
      # niemandem auf. Beim Entfernen des Hero-Bereichs blieben 13 solche
      # Regeln stehen, insgesamt lagen 126 im Bestand.
      - run: npm run css-check

  # ── DIE BROWSER-WÄCHTER ───────────────────────────────────────────────────
  #
  # Der Anlass, 24.08.2026: Ein Prüfbericht fand zwei Oberflächenfehler bei
  # grüner CI und schrieb den Grund gleich dazu — „die vorhandenen
  # Browserabläufe mitbringen und schnellcheck laufen nicht in der
  # CI-Konfiguration."
  #
  # Das war richtig und der Kern der Sache. Die Wächter oben prüfen Typen,
  # Regeln, Einheiten und Textschlüssel. Keiner von ihnen tippt auf einen
  # Knopf. Ein Reiter mit 0 × 0 Pixeln, ein Knopf, der ins Leere führt, ein
  # Feld, das leer bleibt — davon sieht `tsc` nichts.
  #
  # WARUM EIN ZWEITER JOB
  #
  # Damit die schnelle Rückmeldung schnell bleibt. `build-and-test` ist in
  # rund einer Minute durch; die Browserläufe brauchen ein Vielfaches. Wer
  # einen Tippfehler gemacht hat, soll das nicht nach acht Minuten erfahren.
  #
  # WARUM PLAYWRIGHT FEST IM LOCKFILE STEHT
  #
  # Der Wächter ist Teil der Freigabe und muss deshalb reproduzierbar sein.
  # `npm i --no-save playwright` zog zuvor bei jedem Lauf die dann gerade
  # neueste Fassung. So konnte die CI ohne eine einzige Codeänderung brechen.
  # Die Bibliothek ist jetzt exakt gepinnt; nur der Chromium-Browser wird in
  # diesem Job nachgeladen.
  #
  # WELCHE LÄUFE
  #
  # Die Kernwege, die den gemeldeten Fehlerklassen entsprechen: der Hauptweg
  # von vorn bis hinten samt der drei Auflagen (`durchlauf`), die mitgebrachte
  # Datei (`mitbringen`), der Weg ohne Maschine samt Filter (`schnellcheck`)
  # sowie Bedienbudgets und die responsive Audio-Reise. Runde und Reihe laufen
  # wegen mehrerer vollständiger Aufnahmen wöchentlich im erweiterten UI-Lauf.
  # `stammvergleich` fehlt bewusst — er braucht eine Arbeitskopie von
  # TourFuchs, die hier nicht liegt.
  browser-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Die Wächter laufen gegen `dist/`, nicht gegen den Entwicklungsserver.
      - run: npm run build
      - run: npm run a11y
      # Bedienlast, Textbreite und die mobile Nutzerreise sind Teil der
      # Freigabe. `wow` prüft zusätzlich Hell/Dunkel, Handy/Tablet/Desktop und
      # den echten Audio-Zustandswechsel bis zum Ergebnis.
      - run: npm run attention-check
      - run: npm run wow
      - run: npm run durchlauf
      - run: npm run mitbringen
      - run: npm run schnellcheck
      - run: npm run update-weg
