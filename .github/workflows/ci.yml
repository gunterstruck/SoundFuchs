name: CI

# Bis hierher gab es nur den Deploy auf GitHub Pages – der läuft erst NACH dem
# Merge und prüft nur, ob `tsc` im Build durchkommt. Ein Pull Request wurde
# damit von nichts geprüft. Diese Datei schließt die Lücke: dieselben vier
# Befehle, die auch lokal gelten, laufen bei jedem PR und bei jedem Push auf
# main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      # Zwei Prüfungen für Fehler, die sonst niemand meldet.
      #
      # check-i18n: Fünf Sprachen, ein Schlüsselsatz — und zusätzlich, ob ein
      # verwendeter Schlüssel überhaupt existiert. Die zweite Hälfte fehlte
      # bisher: t() gibt bei unbekanntem Schlüssel den Schlüssel selbst zurück,
      # in der Oberfläche stand also wörtlich "buttons.ok". 28 solche Stellen
      # lagen unbemerkt im Bestand, weil alle fünf Sprachen einträchtig
      # dasselbe vermissten.
      #
      # token-check: CSS meldet einen falsch geschriebenen Variablennamen nicht.
      # `background: var(--card-bg)` fällt still aus, wenn das Token --bg-card
      # heißt — weiße Schrift steht dann auf durchsichtigem Grund.
      - run: npm run check-i18n
      - run: npm run token-check
      # css-check: Eine Regel fuer ein Element, das es nicht mehr gibt, faellt
      # niemandem auf. Beim Entfernen des Hero-Bereichs blieben 13 solche
      # Regeln stehen, insgesamt lagen 126 im Bestand.
      - run: npm run css-check
