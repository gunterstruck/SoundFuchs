name: Extended UI

on:
  workflow_dispatch:
  schedule:
    # Wöchentlich außerhalb der üblichen vollen Stunde. Diese beiden Läufe
    # nehmen mehrere echte 10-Sekunden-Messungen auf und sind deshalb bewusst
    # nicht Teil jeder kleinen Freigabe.
    - cron: '43 3 * * 1'

permissions:
  contents: read

concurrency:
  group: extended-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multi-machine-journeys:
    name: ${{ matrix.journey }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        journey: [runde, reihe]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run ${{ matrix.journey }}
